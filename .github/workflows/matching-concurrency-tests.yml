name: Matching Concurrency Integration Tests

on:
  push:
    branches: [ main, master, update/matching ]
  pull_request:
  workflow_dispatch:

jobs:
  matching-concurrency-tests:
    name: Matching flow — PostgreSQL concurrency integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run matching-flow concurrency tests (Testcontainers PostgreSQL)
        run: ./gradlew :backend:test --tests "com.walkmate.matching.*" --info

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-concurrency-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

      - name: Re-run contention tests (flakiness check)
        run: ./gradlew :backend:test --tests "com.walkmate.matching.*" --rerun-tasks
