# ==============================
# ENVIRONMENT VARIABLES
# ==============================
# Automatically loaded by spring-dotenv library

# ==============================
# DATASOURCE (Supabase)
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# LOGGING & TRACING CONFIG
# ==============================
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0

# Logging Level
logging.level.root=INFO
logging.level.com.walkmate=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Write backend logs to file
logging.file.name=logs/backend.log

# Pattern cho console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [traceId=%mdc{traceId:-},spanId=%mdc{spanId:-}] [%15.15t] %-40.40logger{39} : %m%n

# Pattern cho file (chi tiết hơn)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [traceId=%mdc{traceId:-},spanId=%mdc{spanId:-}] [%thread] %logger{50} : %msg%n

# ==============================
# LOG ROTATION (QUAN TRỌNG)
# ==============================
# File tối đa 10MB, sau đó rotate
logging.logback.rollingpolicy.max-file-size=10MB

# Giữ tối đa 7 file cũ
logging.logback.rollingpolicy.max-history=7

# Tổng dung lượng tối đa
logging.logback.rollingpolicy.total-size-cap=100MB

# Pattern tên file rotate
logging.logback.rollingpolicy.file-name-pattern=logs/app.%d{yyyy-MM-dd}.%i.log

# ==============================
# FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ==============================
# REPORT POLICY
# ==============================
# Time window (in hours) during which a COMPLETED session can be reported.
app.report.completed-window-hours=72
# Time window (in hours) during which an ABORTED session can be reported.
app.report.terminal-window-hours=24

# ==============================
# FILE STORAGE (Phase 7)
# ==============================
# Local upload directory (relative to working dir or absolute path)
app.file.upload-dir=./uploads
# Base URL used to construct public avatar URLs
app.file.public-base-url=http://localhost:8080
server.address=0.0.0.0
# Multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==============================
# MONGODB ATLAS (Chat)
# ==============================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:walkmate}

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
