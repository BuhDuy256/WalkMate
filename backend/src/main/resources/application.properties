##==============================
# ENVIRONMENT VARIABLES
# ==============================
# Automatically loaded by spring-dotenv library

# ==============================
# DATASOURCE (Supabase)
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# LOGGING & TRACING CONFIG
# ==============================
# Actuator endpoints needed for tracing propagation in Spring Boot 3
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0

# Logging Level
logging.level.com.walkmate=DEBUG
logging.level.org.springframework.web=INFO

# ==============================
# FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

# Customize Log Pattern to include TraceId and SpanId via MDC explicitly 
# (By default Spring Boot 3 + Brave adds it, but making it explicit helps structure)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [traceId=%mdc{traceId:-},spanId=%mdc{spanId:-}] [%15.15t] %-40.40logger{39} : %m%n
